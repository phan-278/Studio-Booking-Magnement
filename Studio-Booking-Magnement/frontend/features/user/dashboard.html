<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trang cá nhân — Kép Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Be+Vietnam+Pro:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream:#EDE5D0; --cream-dark:#DDD3B8; --cream-deep:#CFC3A6;
      --red:#A31C1C; --red-light:#C42B2B; --red-dim:#7A1515;
      --ink:#1E1710; --ink-light:#3A2E20; --warm-grey:#8A7D6A;
      --border:rgba(163,28,28,0.15); --ease:cubic-bezier(0.16,1,0.3,1);
      --font-brand:'Playfair Display',Georgia,serif;
      --font-display:'DM Serif Display',Georgia,serif;
      --font-body:'Be Vietnam Pro',sans-serif;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html{font-size:16px;} body{background:var(--cream);color:var(--ink);font-family:var(--font-body);min-height:100vh;}

    /* Layout */
    .dash-layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}

    /* Sidebar */
    .dash-sidebar{background:var(--ink);display:flex;flex-direction:column;padding:32px 0;position:sticky;top:0;height:100vh;overflow-y:auto;}
    .dash-brand{padding:0 24px 28px;border-bottom:1px solid rgba(237,229,208,.08);margin-bottom:16px;}
    .dash-brand-name{font-family:var(--font-brand);font-style:italic;font-weight:700;font-size:1.5rem;color:var(--cream);text-decoration:none;display:block;}
    .dash-brand-role{font-family:var(--font-body);font-size:.44rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(237,229,208,.3);margin-top:4px;display:block;}
    .dash-nav{flex:1;}
    .dash-nav-section{font-family:var(--font-body);font-size:.42rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(237,229,208,.22);padding:16px 24px 7px;}
    .dash-nav-link{display:flex;align-items:center;gap:10px;padding:11px 24px;font-family:var(--font-body);font-size:.62rem;letter-spacing:.06em;color:rgba(237,229,208,.48);text-decoration:none;transition:all .25s;border-left:2px solid transparent;}
    .dash-nav-link .nav-icon{font-size:.82rem;opacity:.55;flex-shrink:0;}
    .dash-nav-link:hover{color:var(--cream);background:rgba(237,229,208,.04);}
    .dash-nav-link.active{color:var(--cream);border-left-color:var(--red);background:rgba(163,28,28,.14);}
    .dash-nav-link.active .nav-icon{opacity:1;}
    .dash-sidebar-footer{padding:20px 24px 0;border-top:1px solid rgba(237,229,208,.08);margin-top:16px;}
    .dash-user-avatar{width:34px;height:34px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--font-body);font-size:.76rem;font-weight:600;color:#fff;flex-shrink:0;}
    .dash-user-info{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
    .dash-user-name{font-family:var(--font-body);font-size:.65rem;color:var(--cream);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .dash-user-email{font-family:var(--font-body);font-size:.5rem;color:rgba(237,229,208,.32);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .dash-logout-btn{width:100%;padding:9px;background:transparent;border:1px solid rgba(237,229,208,.14);color:rgba(237,229,208,.45);font-family:var(--font-body);font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:all .3s;}
    .dash-logout-btn:hover{border-color:var(--red);color:var(--red);}

    /* Main */
    .dash-main{display:flex;flex-direction:column;min-height:100vh;}
    .dash-topbar{background:#fff;border-bottom:1px solid var(--border);padding:16px 36px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .dash-page-title{font-family:var(--font-display);font-style:italic;font-size:1.1rem;color:var(--ink);}
    .dash-topbar-actions{display:flex;align-items:center;gap:10px;}
    .dash-action-btn{font-family:var(--font-body);font-size:.54rem;letter-spacing:.14em;text-transform:uppercase;padding:9px 18px;cursor:pointer;transition:all .3s;text-decoration:none;display:inline-block;}
    .dash-action-btn.primary{background:var(--red);color:#fff;border:none;}
    .dash-action-btn.primary:hover{background:var(--red-dim);}
    .dash-content{padding:36px;flex:1;}

    /* Stat cards */
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:32px;}
    .stat-card-d{background:#fff;border:1px solid var(--border);padding:22px 20px;transition:border-color .3s;}
    .stat-card-d:hover{border-color:var(--cream-deep);}
    .stat-card-label{font-family:var(--font-body);font-size:.44rem;letter-spacing:.2em;text-transform:uppercase;color:var(--warm-grey);margin-bottom:8px;}
    .stat-card-value{font-family:var(--font-display);font-style:italic;font-size:2rem;line-height:1;color:var(--ink);}
    .stat-card-value.red{color:var(--red);}
    .stat-card-sub{font-family:var(--font-body);font-size:.54rem;color:var(--warm-grey);margin-top:6px;}

    /* Section */
    .dash-section-title{font-family:var(--font-display);font-style:italic;font-size:1.05rem;color:var(--ink);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
    .dash-section-title a{font-family:var(--font-body);font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:var(--red);text-decoration:none;}

    /* Booking cards */
    .booking-card{background:#fff;border:1px solid var(--border);padding:20px 22px;margin-bottom:12px;display:grid;grid-template-columns:1fr auto;gap:14px;transition:border-color .3s;text-decoration:none;}
    .booking-card:hover{border-color:var(--cream-deep);}
    .booking-card-code{font-family:var(--font-body);font-size:.48rem;letter-spacing:.18em;text-transform:uppercase;color:var(--red);margin-bottom:5px;}
    .booking-card-zone{font-family:var(--font-brand);font-style:italic;font-weight:700;font-size:1rem;color:var(--ink);margin-bottom:4px;}
    .booking-card-meta{font-family:var(--font-body);font-size:.62rem;color:var(--warm-grey);line-height:1.9;}
    .booking-card-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
    .booking-card-amount{font-family:var(--font-display);font-style:italic;font-size:1.3rem;color:var(--ink);}
    .badge{font-family:var(--font-body);font-size:.42rem;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;}
    .badge-pending{background:rgba(212,160,23,.12);color:#8a6200;}
    .badge-confirmed{background:rgba(46,125,50,.1);color:#2E7D32;}
    .badge-rejected{background:rgba(163,28,28,.1);color:var(--red);}
    .badge-cancelled{background:rgba(138,125,106,.1);color:var(--warm-grey);}

    /* Empty */
    .empty-state{text-align:center;padding:60px 40px;background:#fff;border:1px solid var(--border);}
    .empty-icon{font-size:2rem;opacity:.25;margin-bottom:14px;}
    .empty-title{font-family:var(--font-display);font-style:italic;font-size:1rem;color:var(--warm-grey);margin-bottom:8px;}
    .empty-sub{font-family:var(--font-body);font-size:.63rem;color:var(--cream-deep);}

    @media(max-width:960px){.dash-layout{grid-template-columns:1fr;} .dash-sidebar{display:none;} .stats-grid{grid-template-columns:1fr 1fr;} .dash-content{padding:24px 20px;}}
  </style>
</head>
<body>
<div class="dash-layout">
  <!-- Sidebar -->
  <aside class="dash-sidebar">
    <div class="dash-brand">
      <a class="dash-brand-name" href="../../index.html">"Kép"</a>
      <span class="dash-brand-role">Trang cá nhân</span>
    </div>
    <nav class="dash-nav">
      <div class="dash-nav-section">Tổng quan</div>
      <a class="dash-nav-link active" href="dashboard.html"><span class="nav-icon">◈</span> Dashboard</a>
      <div class="dash-nav-section">Booking</div>
      <a class="dash-nav-link" href="my-bookings.html"><span class="nav-icon">◷</span> Lịch sử đặt lịch</a>
      <div class="dash-nav-section">Tài khoản</div>
      <a class="dash-nav-link" href="profile.html"><span class="nav-icon">◎</span> Hồ sơ cá nhân</a>
      <a class="dash-nav-link" href="settings.html"><span class="nav-icon">◫</span> Cài đặt</a>
      <div class="dash-nav-section">Khác</div>
      <a class="dash-nav-link" href="../../index.html"><span class="nav-icon">↗</span> Về trang chủ</a>
    </nav>
    <div class="dash-sidebar-footer">
      <div class="dash-user-info">
        <div class="dash-user-avatar" id="sbAvatar">K</div>
        <div><div class="dash-user-name" id="sbName">—</div><div class="dash-user-email" id="sbEmail">—</div></div>
      </div>
      <button class="dash-logout-btn" onclick="doLogout()">Đăng xuất</button>
    </div>
  </aside>

  <!-- Main -->
  <div class="dash-main">
    <div class="dash-topbar">
      <h1 class="dash-page-title">Xin chào, <span id="greetName">—</span></h1>
      <div class="dash-topbar-actions">
        <a class="dash-action-btn primary" href="../booking/new-booking.html">✦ Đặt lịch mới</a>
      </div>
    </div>

    <div class="dash-content">
      <!-- Stats -->
      <div class="stats-grid" id="statsGrid"></div>

      <!-- Recent bookings -->
      <div class="dash-section-title">
        Booking gần đây
        <a href="my-bookings.html">Xem tất cả →</a>
      </div>
      <div id="recentBookings"></div>
    </div>
  </div>
</div>

<script>
const _u = JSON.parse(localStorage.getItem('kep_user') || 'null');
if (!_u) { window.location.href = '../../index.html'; }

const name = (_u?.firstName || _u?.name || 'Khách');
document.getElementById('greetName').textContent = name;
document.getElementById('sbName').textContent    = (_u?.firstName || '') + ' ' + (_u?.lastName || '');
document.getElementById('sbEmail').textContent   = _u?.email || '';
document.getElementById('sbAvatar').textContent  = (name[0] || 'K').toUpperCase();

function doLogout() {
  localStorage.removeItem('kep_user');
  window.location.href = '../../index.html';
}

// Load bookings
const allBk = JSON.parse(localStorage.getItem('kep_bookings') || '[]').filter(b => b.userId === _u?.id || !b.userId);
const counts = { total: allBk.length, pending: allBk.filter(b=>b.status==='pending').length, confirmed: allBk.filter(b=>b.status==='confirmed').length };

document.getElementById('statsGrid').innerHTML = `
  <div class="stat-card-d"><div class="stat-card-label">Tổng đặt lịch</div><div class="stat-card-value">${counts.total}</div><div class="stat-card-sub">Tất cả thời gian</div></div>
  <div class="stat-card-d"><div class="stat-card-label">Chờ xác nhận</div><div class="stat-card-value red">${counts.pending}</div><div class="stat-card-sub">Đang xử lý</div></div>
  <div class="stat-card-d"><div class="stat-card-label">Đã xác nhận</div><div class="stat-card-value">${counts.confirmed}</div><div class="stat-card-sub">Hoàn thành</div></div>
  <div class="stat-card-d"><div class="stat-card-label">Thành viên từ</div><div class="stat-card-value" style="font-size:1.1rem;">${_u?.createdAt ? new Date(_u.createdAt).getFullYear() : '—'}</div><div class="stat-card-sub">Khách hàng thân thiết</div></div>
`;

const recent = [...allBk].reverse().slice(0, 4);
const bkEl = document.getElementById('recentBookings');
if (!recent.length) {
  bkEl.innerHTML = `<div class="empty-state"><div class="empty-icon">◷</div><div class="empty-title">Chưa có booking nào</div><div class="empty-sub">Bắt đầu đặt lịch để tận hưởng không gian sáng tạo của Kép Studio.</div></div>`;
} else {
  const badge = s => `<span class="badge badge-${s}">${{pending:'Chờ xác nhận',confirmed:'Đã xác nhận',rejected:'Từ chối',cancelled:'Đã hủy'}[s]||s}</span>`;
  bkEl.innerHTML = recent.map(b => `
    <a class="booking-card" href="my-bookings.html">
      <div><div class="booking-card-code">${b.id}</div><div class="booking-card-zone">${b.zone}</div><div class="booking-card-meta">${b.date || '—'} · ${b.startTime||''} – ${b.endTime||''}</div></div>
      <div class="booking-card-right"><div class="booking-card-amount">${b.total ? b.total.toLocaleString()+'K' : 'TBD'}</div>${badge(b.status)}</div>
    </a>
  `).join('');
}
</script>
</body>
</html>
